- id: kids_light_automation
  alias: "släck nattljus i barnens rum"
  trigger:
    - platform: numeric_state
      entity_id: sun.sun
      value_template: "{{ state.attributes.elevation }}"
      above: 0
  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.samuels_nattlampa
          - light.nattlampa_vendela

- id: lights_master_bedroom_sun
  alias: "Fönsterlampa styrd av solen"
  trigger:
    - platform: numeric_state
      entity_id: sun.sun
      value_template: "{{ state.attributes.elevation }}"
      above: -2.0
      id: "sun_up"
    - platform: numeric_state
      entity_id: sun.sun
      value_template: "{{ state.attributes.elevation }}"
      below: -2.0
      id: "sun_down"
  condition:
    - condition: state
      entity_id: input_boolean.all_asleep
      state: "off"
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: "sun_down"
            - condition: time
              before: input_datetime.night_time
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.strombrytare_fonsterlampa
        - conditions:
            - condition: trigger
              id: "sun_up"
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.strombrytare_fonsterlampa

- id: lights_master_bedroom_button
  alias: "Fönsterlampa styrd av knapp"
  trigger:
    - platform: mqtt
      topic: zigbee2mqtt/0x00158d00028f466f/action
      payload: single
  action:
    - service: light.toggle
      target:
        entity_id: light.strombrytare_fonsterlampa
